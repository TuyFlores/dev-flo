<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>

    <style>
        h1 {
            color: blue;
        }

        .legal {
            color: green;
            border: 1px solid black;
            font-size: 32px;
        }

        .exemplo {
            color: red;
            border: 1px solid black;
            font-size: 32px;  
        }
    </style>

</head>
<body>
  
<h1>Amor</h1>

<h1 class="legal">Vamos entender as Tags e Seletores</h1>

<p class="exemplo">Este é um parágrafo de exemplo.</p>
</body>

</html>
