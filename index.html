<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aula 4</title>

</head>
<body>

<table border="1" cellspacing="5" cellpadding="7">
      <tr>
        <td colspan="5">
             <h2>Formulario</h2>  
       </td>
  
     </tr>
</table>
<br><br>

  <form action="#" method="post">
      
      <label for="name">Nome:</label>
      <BR></BR>
      <input type="text" id="name" name="name" placeholder="seu nome completo">
      <br><br>
      <label for="email">E-mail:</label>
      <br><br>
      <input type="email" id="email" name="email" placeholder="seuemail@email.com">
      <br><br>
      <label for="email">E-mail:</label>
      <br><br>
      <input type="email" id="email" placeholder="seuemail@email.com">
      <br><br>
      <label for="senha">Senha (min 6, só letras e números):</label>
      <br><br>
      <input type="password" id="senha" pattern="[a-zA-Z0-9]{6,}" placeholder="Minimo 6 caracteres..." required>
      <br><br>
      <label for="idade">Idade (13 a 99)</label>
      <br><br>
      <input type="number" id="idade" name="idade" min="13" max="99" required>
      <br><br>
      <label for="data">Data de Nascimento: (2026)</label>
      <br><br>
      <input type="date" id="data" min="2026-01-01" max="2026-12-31" >
      <br><br>
      <label for="telefone">Telefone:</label>
      <br><br>
      <input type="tel" id="telefone" pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}" placeholder="(51) 99999-9999">
      <br><br>
      <label for="nota">Nota (0 a 10)</label>
      <input type="range" id="nota" min="0" max="10" value="7">
      <br><br>
      <label for="cor">Cor favorita:</label>
      <br><br>
      <input type="color" id="cor" value="#3498db">
      <br><br>
      <label for="codigo">Codigo (gerado automatico)</label>
      <input type="text" id="codigo" value="ALU-2026-001" disabled>
      <br><br>
      <button type="submit">Enviar</button>




      <fieldset>
            <legend>Genero</legend>
            <label for="masculino"></label>
            <input type="radio" id="masculino" name="genero" value="M">
            <label for="masculino">Masculino</label>
            <input type="radio" id="feminino" name="genero" value="F">
            <label for="feminino">Feminino</label>
            <label for="outro"></label>
            <input type="radio" id="outro" name="genero" value="O">
            <label for="outro">Outro</label>

    </form>







                              <br><br>  
                    <input type="submit" value="Enviar">
  </form>







</body>

</html>
