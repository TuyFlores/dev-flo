<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>

    <style>
     
     h1{
      color: indigo;
      font-size: 35px;
      
     }
     
     
     table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        border: 1px solid black;
        padding: 8px;
        text-align: left;
      }

      th {
        background-color: #f2f2f2;
      }

      .sentimento {
        color: red;
      }

      .sentido {
        color: blue;
      }

    </style>

</head>
<body>

<h1>Sentimentos e Seus Sentidos</h1>

<br><br>
<br><br>
  <table>
    <tr>
      <th class="sentimento">Sentimento</th>
      <th class="sentido">Sentido</th>
    </tr>
    <tr>
      <td>Amor</td>
      <td>Sentimento de afeto profundo.</td>
    </tr>
    <tr>
      <td>Odio</td>
      <td>Sentimento de aversão intensa.</td>
    </tr>
    <tr>
      <td>Felicidade</td>
      <td>Sentimento de alegria e contentamento.</td>
    </tr>
  </table>

</body>

</html>
